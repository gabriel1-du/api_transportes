spring.application.name=api_transporte
# Se busca el .env tanto en la raiz del proyecto como un nivel arriba (ej: ejecutando desde target/)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:./api_usuarios/.env[.properties]


# puerto
server.port=${SERVER_PORT:8084}

# conf base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:transporte_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:hola123}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# driver mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


#conexion con otros microservicios
usuarios.service.url=${USUARIOS_URL:http://localhost:8080/api/usuariosApi}
inventario.service.url=${INVENTARIO_URL:http://localhost:8083/api/historietaApi}   
compras.service.url=${COMPRAS_URL:http://localhost:8081/api/boletasApi}   